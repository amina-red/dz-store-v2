security:
    password_hashers:
        App\Entity\AdminUser: 'auto'

    providers:
        admins:
            entity:
                class: App\Entity\AdminUser
                property: email

    firewalls:
        dev:
            pattern: ^/_(profiler|wdt)
            security: false

        main:
            lazy: true
            provider: admins

            # POST /api/admin/login with {"email": "...", "password": "..."}
            json_login:
                check_path: api_admin_login
                username_path: email
                password_path: password
                success_handler: App\Security\LoginResponder
                failure_handler: App\Security\LoginResponder

            # 5 wrong passwords for one email (or one IP) = locked for 15 minutes.
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

            logout:
                path: api_admin_logout

            # Answer with JSON 401/403 instead of redirecting to a login page.
            entry_point: App\Security\JsonEntryPoint
            access_denied_handler: App\Security\JsonEntryPoint

    access_control:
        - { path: ^/api/admin/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            App\Entity\AdminUser:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
